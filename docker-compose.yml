services:
  postgres:
    image: postgres:16-alpine
    container_name: aidevagent-postgres
    environment:
      POSTGRES_USER: aidevagent
      POSTGRES_PASSWORD: aidevagent
      POSTGRES_DB: aidevagent
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aidevagent -d aidevagent"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
